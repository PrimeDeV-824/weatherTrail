<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4638" />
      <stop offset="100%" stop-color="#3b2a21" />
    </linearGradient>
    
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#adc178" />
      <stop offset="100%" stop-color="#708c3e" />
    </linearGradient>

    <!-- Compass Pointer North (Emerald) -->
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e76f51" />
      <stop offset="100%" stop-color="#c94b2a" />
    </linearGradient>

    <!-- Compass Pointer South (Cream) -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4ede4" />
      <stop offset="100%" stop-color="#d9cdbe" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#e9c46a" />
    </radialGradient>
  </defs>

  <!-- Base Circle with Soft Shadow -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Inner Compass Track -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#f4ede4" stroke-width="1" stroke-dasharray="2,3" opacity="0.45" />

  <!-- Subtle Mountain Silhouette in Background -->
  <path d="M14 43 L25 31 L33 39 L41 29 L50 43 Z" fill="#adc178" opacity="0.3" />

  <!-- Compass Star / Needle -->
  <!-- North Needle (Red/Orange pointing top-right towards adventure) -->
  <polygon points="32,9 36,32 32,30" fill="url(#needleNorth)" />
  <polygon points="32,9 28,32 32,30" fill="#e76f51" opacity="0.85" />

  <!-- South Needle (Cream) -->
  <polygon points="32,55 36,32 32,34" fill="url(#needleSouth)" />
  <polygon points="32,55 28,32 32,34" fill="#d9cdbe" opacity="0.85" />

  <!-- West Needle (Subtle) -->
  <polygon points="9,32 32,28 30,32" fill="#adc178" opacity="0.7" />
  <polygon points="9,32 32,36 30,32" fill="#708c3e" opacity="0.7" />

  <!-- East Needle (Subtle) -->
  <polygon points="55,32 32,28 34,32" fill="#adc178" opacity="0.7" />
  <polygon points="55,32 32,36 34,32" fill="#708c3e" opacity="0.7" />

  <!-- Cardinal Points Dots -->
  <circle cx="32" cy="14" r="1.5" fill="#f4ede4" />
  <circle cx="50" cy="32" r="1.5" fill="#f4ede4" opacity="0.6" />
  <circle cx="32" cy="50" r="1.5" fill="#f4ede4" opacity="0.6" />
  <circle cx="14" cy="32" r="1.5" fill="#f4ede4" opacity="0.6" />

  <!-- Center Pivot -->
  <circle cx="32" cy="32" r="4" fill="url(#sunGlow)" stroke="#3b2a21" stroke-width="1.2" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
